name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub prove who it is to AWS, no stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check content and build
        run: python3 build.py

      - name: Sign in to AWS
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
        run: bash scripts/deploy-site.sh

      - name: Waiting for AWS variables
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "Built fine. Add AWS_ROLE_ARN, SITE_BUCKET and DISTRIBUTION_ID as repo variables to start publishing (see README)."
